<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dedicatórias</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Libre+Baskerville&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0a0a0c;
  color: #eaeaea;
  font-family: 'Inter', sans-serif;
  overflow-x: hidden;
}

/* 📚 BOTÃO */
.btn-dedicados {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  cursor: pointer;
  color: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  z-index: 10;
}

.btn-dedicados:hover {
  color: #ff5c8a;
  border-color: rgba(255,92,138,0.4);
  transform: translateY(-1px);
}


/* 📂 SIDEBAR */
.sidebar {
  position: fixed;
  top: 0; /* 👈 volta para o topo */
  left: 0;
  width: 260px;
  height: 100vh;
  background: #111114;
  padding: 65px 10px 10px; /* 👈 empurra os dedicados pra baixo */
  transform: translateX(-100%);
  transition: 0.4s ease;
  z-index: 9;
}


.sidebar.aberta {
  transform: translateX(0);
}

.sidebar h3 {
  margin-bottom: 20px;
  font-weight: 400;
  letter-spacing: 1px;
  color: #aaa;
}

/* 📖 ITEM */
.item {
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
  background: rgba(255,255,255,0.05);
  cursor: pointer;
  transition: 0.3s;
}

.item:hover {
  background: rgba(255, 92, 138, 0.2);
}

/* 📝 TEXTO */
.conteudo {
  max-width: 720px;
  margin: 120px auto;
  padding: 0 20px;
}

h1 {
  font-family: 'Libre Baskerville', serif;
  font-size: 36px;
  margin-bottom: 40px;
}

.texto {
  font-size: 17px;
  line-height: 1.9;
  white-space: pre-line;
  color: #dcdcdc;
}

/* 🔵 INDICADOR DE NOVO */
.item {
  position: relative;
}

.item .novo {
  position: absolute;
  top: 50%;
  right: 16px;
  width: 8px;
  height: 8px;
  background: #4da3ff;
  border-radius: 50%;
  transform: translateY(-50%);
  box-shadow: 0 0 8px rgba(77,163,255,0.8);
}

</style>
</head>

<body>

<body>

<!-- ÍCONE DEDICADOS -->
<button class="btn-dedicados" onclick="toggleSidebar()" aria-label="Dedicados">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
    <rect x="3" y="4" width="18" height="16" rx="3"
          stroke="currentColor" stroke-width="1.6"/>
    <line x1="3" y1="8" x2="21" y2="8"
          stroke="currentColor" stroke-width="1.6"/>
    <line x1="8" y1="8" x2="8" y2="20"
          stroke="currentColor" stroke-width="1.2"/>
  </svg>
</button>


<div class="sidebar" id="sidebar">
  <h3>
  </h3>

  <div class="item" data-id="04012026" onclick="carregarTexto('04012026')">
  Dedicado • 04/01/2026
  <span class="novo"></span>
</div>


  <div class="item" data-id="12022026" onclick="carregarTexto('12022026')">
  Dedicado • 12/01/2026
  <span class="novo"></span>
</div>

  </div>
</div>

<div class="conteudo">
  <h1 id="titulo">Algumas palavras</h1>
  <div class="texto" id="texto">
    Escolha um dedicado para ler.
  </div>
</div>

<script>
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("aberta");
}

/* 💌 TEXTOS */

// 🔍 Verifica quais dedicados já foram lidos
document.querySelectorAll(".item").forEach(item => {
  const id = item.dataset.id;
  const lido = localStorage.getItem("dedicado_" + id);

  if (lido === "lido") {
    const bolinha = item.querySelector(".novo");
    if (bolinha) bolinha.remove();
  }
});


function carregarTexto(id) {
  document.getElementById("texto").innerText = textos[id];

  marcarComoLido(id);

  const item = document.querySelector(`.item[data-id="${id}"] .novo`);
  if (item) item.remove();

  toggleSidebar();
}


function marcarComoLido(id) {
  localStorage.setItem("dedicado_" + id, "lido");
}

</script>

<script>
let touchStartX = 0;
let touchEndX = 0;

const sidebar = document.getElementById("sidebar");

document.addEventListener("touchstart", function (e) {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", function (e) {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
});

function handleSwipe() {
  const swipeDistance = touchEndX - touchStartX;

  // 👉 swipe da esquerda para direita (abrir)
  if (swipeDistance > 80 && touchStartX < 50) {
    sidebar.classList.add("aberta");
  }

  // 👉 swipe da direita para esquerda (fechar)
  if (swipeDistance < -80 && sidebar.classList.contains("aberta")) {
    sidebar.classList.remove("aberta");
  }
}
</script>

</body>
</html>
