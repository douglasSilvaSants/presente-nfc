<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Para Uesleiana ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonte romântica -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at top, #1a0b14, #050207);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-family: 'Poppins', sans-serif;
}

/* 🌌 CANVAS */
#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* 💎 CARD */
.card {
  position: relative;
  z-index: 1;
  max-width: 420px;
  padding: 35px 28px;
  border-radius: 24px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.12),
    rgba(255, 255, 255, 0.04)
  );
  backdrop-filter: blur(18px);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.6),
    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  text-align: center;
  animation: aparecer 1.8s ease;
}

/* ✨ ENTRADA */
@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.coracao {
  font-size: 52px;
  margin-bottom: 10px;
  animation: pulsar 1.6s infinite ease-in-out;
}

@keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.25); }
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  margin: 10px 0;
  letter-spacing: 0.5px;
}

p {
  font-size: 16px;
  line-height: 1.7;
  opacity: 0.92;
}

/* ❓ PERGUNTA */
input {
  margin-top: 12px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-size: 15px;
  text-align: center;
  outline: none;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

input::placeholder {
  color: rgba(255,255,255,0.6);
}

button {
  margin-top: 18px;
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  background: linear-gradient(135deg, #ff4d7e, #ff1f5a);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.35s;
}

button:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 15px 35px rgba(255, 77, 126, 0.6);
}

.erro {
  margin-top: 12px;
  color: #ffb3bd;
}

/* 💖 MENSAGEM */
.mensagem {
  display: none;
  margin-top: 15px;
  animation: aparecer 1.5s ease;
  
  
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

.vibrate {
  animation: shake 0.4s;
}

</style>

</head>
<body>
  <canvas id="stars"></canvas>
    <audio id="audio">
  <source src="Iwanna.mp3.mp3" type="audio/mpeg">
</audio>

  <div class="card">
    <div id="pergunta">
      <div class="coracao">❤️</div>
      <h1>Um segredo só nosso</h1>
      <p>
        Antes de continuar,<br>
        responde algo que só nós sabemos.
      </p>

      <div class="pergunta">
        <p><strong>Qual é a minha comida preferida?</strong></p>
        <input type="text" id="resposta" placeholder="Digite com carinho…">
        <button onclick="verificar()">Continuar</button>
        <div class="erro" id="erro"></div>
      </div>
    </div>

    <div class="mensagem" id="mensagem">
      <div class="coracao">💖</div>
      <h1>É você</h1>
      <p>
        Se você chegou até aqui,<br>
        é porque meu coração escolheu o seu.
      </p>
      <p>
        Não importa onde estejamos,<br>
        você sempre vai carregar comigo<br>
        aquilo que não se vê,<br>
        mas se sente.
      </p>
      <p>
        Eu te amo.
      </p>
    </div>
  </div>

 <script>

  function verificar() {
    const respostaCorreta = "lasanha"; // MUDE AQUI
    const resposta = document.getElementById("resposta").value
      .toLowerCase()
      .trim();

    if (resposta === respostaCorreta) {
      document.getElementById("pergunta").style.display = "none";
      document.getElementById("mensagem").style.display = "block";
      
    // Vibração no celular (se suportado)
    if (navigator.vibrate) {
      navigator.vibrate([300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300, 150, 300 ]);
}
      const audio = document.getElementById("audio");
      audio.play();
    } else {
      document.getElementById("erro").innerText = "Hmm… tenta de novo 💭";
    }
  }
  // Detecta iPhone / iOS
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

// Áudio de feedback (iOS permite)
const feedbackSound = new Audio("Vibration.mp3");

// Função de feedback universal
function feedback(element) {

  // 🔔 Som
  feedbackSound.currentTime = 0;
  feedbackSound.play().catch(() => {});

  // 🤖 Vibração (somente Android)
  if (!isIOS && navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }

  // 🍎 Efeito visual (iPhone e Android)
  element.classList.add("vibrate");
  setTimeout(() => {
    element.classList.remove("vibrate");
  }, 400);
}

</script>

<script>
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let w, h;
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const stars = Array.from({ length: 120 }, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  r: Math.random() * 1.5 + 0.5,
  v: Math.random() * 0.6 + 0.2
}));

function draw() {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "white";

  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.v;
    if (s.y > h) {
      s.y = -2;
      s.x = Math.random() * w;
    }
  });

  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
